<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undangan Zilvi & Syamsul</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">

<style>
*{box-sizing: border-box;}
body{margin:0;font-family: 'Montserrat', sans-serif;background:black;color:white;text-align:center;overflow-x:hidden; scroll-behavior: smooth;}

#loader{position:fixed;width:100%;height:100%;background:black;display:flex;justify-content:center;align-items:center;z-index:99999}
.loader-text{color:gold;font-size:24px;animation:fadeBlink 1s infinite;}

.hero{
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    /* NAMA FILE FOTO SESUAI GITHUB ANDA */
    background: linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)), 
                url('./deb07009-7159-49f3-90a8-bbc6da9acda4.jpg') center/cover;
    background-attachment: fixed;
}

.nama-mewah {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(50px, 15vw, 80px);
    margin: 0;
    background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.section{padding:60px 20px;}
.card{background:rgba(20, 20, 20, 0.9); margin:15px auto; padding:25px; border-radius:15px; border: 1px solid gold; max-width: 450px;}
.btn {padding:15px 30px; background: gold; border:none; border-radius:30px; cursor:pointer; font-weight: bold; color: black; text-decoration: none; display: inline-block; margin-top: 20px;}

#music-toggle { position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; background: gold; border-radius: 50%; z-index: 9999; display: none; justify-content: center; align-items: center; color: black; font-size: 20px; border: 2px solid white; }

@keyframes fadeBlink{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>

<div id="loader"><div class="loader-text">Zilvi & Syamsul</div></div>
<div id="music-toggle" onclick="toggleMusic()">🎵</div>

<div id="main-content">
    <div class="hero">
        <p style="letter-spacing: 5px; font-size: 12px;">THE WEDDING OF</p>
        <h1 class="nama-mewah">Zilvi & Syamsul</h1>
        <p style="margin-top:20px;">22 Mei 2026</p>
        <button class="btn" onclick="startInvitation()">BUKA UNDANGAN</button>
    </div>

    <div class="section" id="isi">
        <div class="card">
            <h2 style="font-family: 'Great Vibes', cursive; font-size: 40px; color: gold;">Zilvi Rizkiani Putri</h2>
            <p>&</p>
            <h2 style="font-family: 'Great Vibes', cursive; font-size: 40px; color: gold;">Syamsul Bahri</h2>
        </div>
        
        <div class="card">
            <h3 style="color: gold;">Akad Nikah</h3>
            <p>Jumat, 22 Mei 2026<br>Mesjid Taqwa Koto Magek</p>
        </div>

        <div class="card">
            <h3 style="color: gold;">Kado Digital</h3>
            <p>Bank BRI: 032101088548501<br>a/n Zilvi Rizkiani Putri</p>
        </div>
    </div>
</div>

<audio id="music" loop>
    <source src="https://files.catbox.moe/1f9jue.mp3" type="audio/mp3">
</audio>

<script>
window.onload = () => { document.getElementById("loader").style.display = "none"; };
const music = document.getElementById("music");
let isPlaying = false;

function startInvitation() {
    music.play();
    isPlaying = true;
    document.getElementById('music-toggle').style.display = 'flex';
    document.getElementById('isi').scrollIntoView({ behavior: 'smooth' });
}

function toggleMusic() {
    if (isPlaying) { music.pause(); } else { music.play(); }
    isPlaying = !isPlaying;
}
</script>
</body>
</html>
