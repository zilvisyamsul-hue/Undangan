<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Zilvi & Syamsul</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Montserrat', sans-serif; background: black; color: white; text-align: center; overflow-x: hidden; }
        
        /* Loader Perbaikan */
        #loader { position: fixed; width: 100%; height: 100%; background: black; display: flex; justify-content: center; align-items: center; z-index: 99999; transition: opacity 0.5s; }
        .loader-text { color: gold; font-size: 24px; animation: fadeBlink 1s infinite; }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Nama file sesuai di GitHub Anda */
            background: linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)), 
                        url('./deb07009-7159-49f3-90a8-bbc6da9acda4.jpg') center/cover;
            background-attachment: fixed;
        }

        .nama-pengantin {
            font-family: 'Great Vibes', cursive;
            font-size: 60px;
            color: gold;
            margin: 0;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section { padding: 60px 20px; }
        .card { background: rgba(20, 20, 20, 0.95); margin: 15px auto; padding: 25px; border-radius: 15px; border: 1px solid gold; max-width: 450px; }
        .btn { padding: 15px 30px; background: gold; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; color: black; text-decoration: none; display: inline-block; margin-top: 20px; }

        @keyframes fadeBlink { 0%, 100% { opacity: 1 } 50% { opacity: .3 } }
    </style>
</head>
<body>

    <div id="loader"><div class="loader-text">Memuat Bahagia...</div></div>

    <div id="main-content">
        <div class="hero">
            <p style="letter-spacing: 5px;">THE WEDDING OF</p>
            <h1 class="nama-pengantin">Zilvi & Syamsul</h1>
            <p style="margin-top:20px;">22 Mei 2026</p>
            <button class="btn" onclick="startInvitation()">BUKA UNDANGAN</button>
        </div>

        <div class="section" id="isi">
            <div class="card">
                <h2 style="font-family: 'Great Vibes', cursive; font-size: 40px; color: gold;">Zilvi & Syamsul</h2>
                <p>Akad Nikah: Jumat, 22 Mei 2026</p>
                <p>Mesjid Taqwa Koto Magek</p>
            </div>
        </div>
    </div>

    <audio id="music" loop>
        <source src="https://files.catbox.moe/1f9jue.mp3" type="audio/mp3">
    </audio>

    <script>
        // Pastikan loader hilang meskipun gambar belum selesai dimuat
        window.addEventListener('load', function() {
            setTimeout(() => {
                document.getElementById("loader").style.opacity = "0";
                setTimeout(() => {
                    document.getElementById("loader").style.display = "none";
                }, 500);
            }, 1000);
        });

        const music = document.getElementById("music");
        function startInvitation() {
            music.play();
            document.getElementById('isi').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
